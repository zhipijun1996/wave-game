name: Publish independent game preview
on:
  push:
    branches: [main]
    paths: [.github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified static game build
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Upload static game
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
